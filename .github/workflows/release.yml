name: Release Windows executable

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip; python -m pip install -r requirements.txt pyinstaller
      - name: Install Playwright browser
        run: python -m playwright install chromium
      - name: Build executable
        run: pyinstaller --noconfirm app.spec
      - name: Create SHA-256 checksum
        shell: pwsh
        run: (Get-FileHash dist/ica_automation.exe -Algorithm SHA256).Hash.ToLower() + "  ica_automation.exe" | Set-Content -NoNewline dist/ica_automation.exe.sha256
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/ica_automation.exe
            dist/ica_automation.exe.sha256